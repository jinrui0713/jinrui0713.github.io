<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>OUN の友達の招待</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  body { margin: 0; padding: 24px 16px; max-width: 480px; margin-inline: auto; line-height: 1.7; }
  h1 { font-size: 1.3rem; }
  .code { font-family: ui-monospace, monospace; word-break: break-all; padding: 12px; border-radius: 12px; background: rgba(127,127,127,.15); user-select: all; }
  a.button { display: block; text-align: center; padding: 14px; border-radius: 14px; background: #0a7aff; color: #fff; text-decoration: none; font-weight: 600; margin: 16px 0; }
  small { color: gray; }
</style>
</head>
<body>
<h1>OUN の友達の招待</h1>
<p><small>ベータ機能です。</small></p>
<p>OUN（岡山大学の学生向けの非公式アプリ）で、友達になる招待が届いています。</p>
<div id="has">
  <a class="button" id="open" href="#">OUN で開く</a>
  <p>開かない場合は、OUN の「設定 → 友達 → 招待を受け取る」に、次の文字を貼り付けてください。</p>
  <div class="code" id="code"></div>
</div>
<p id="none" hidden>招待の情報が見つかりません。招待を送った人に、もう一度リンクを送ってもらってください。</p>
<p><small>この頁は、招待の文字を端末の中で読むだけで、どこにも送信しません。招待には期限があり、1 回だけ使えます。友達になるには、招待した人の承認が必要です。OUN は岡山大学が提供するものではありません。</small></p>
<script>
  var t = decodeURIComponent((location.hash || "").slice(1));
  if (/^[A-Za-z0-9_-]{8,64}$/.test(t)) {
    document.getElementById("code").textContent = t;
    document.getElementById("open").href = "okadai://friend?code=" + encodeURIComponent(t);
  } else {
    document.getElementById("has").hidden = true;
    document.getElementById("none").hidden = false;
  }
</script>
</body>
</html>
